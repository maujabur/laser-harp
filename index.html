<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elka Synthex - Laser Harp (Preset 46)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      text-shadow: 0 0 10px #00ffcc;
      margin: 0 0 5px 0;
    }
    p {
      color: #888;
      margin-bottom: 20px;
    }
    .controls-panel {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px 24px;
      width: 100%;
      max-width: 980px;
      background: #15181e;
      border: 1px solid #00ffcc;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
      margin-bottom: 25px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .control-group label {
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      white-space: nowrap;
    }
    .control-group label span {
      flex: none;
    }
    .control-group input[type=range] {
      accent-color: #00ffcc;
      cursor: pointer;
      width: 100%;
    }

    .keys-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 800px;
    }
    .key-box {
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      border: 1px solid #00ffcc;
      padding: 15px 18px;
      border-radius: 4px;
      text-align: center;
      min-width: 30px;
      box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
    }
    .key-box.active {
      background-color: #00ffcc;
      color: #0d0f12;
      box-shadow: 0 0 20px #00ffcc;
    }
    .key-label {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .note-label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 4px;
    }
    .keys-container { width: 100%; touch-action: none; }
    @media (min-width: 900px) {
      .keys-container { max-width: 1280px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .key-box { min-width: 0; padding: 15px 6px; }
    }
    .key-box { flex: 1 1 72px; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
    .controls-panel summary { cursor: pointer; font-weight: bold; }
    @media (max-width: 600px) {
      body { padding: 12px; justify-content: flex-start; }
      h1 { font-size: 1.3rem; text-align: center; }
      p { text-align: center; }
      .keys-container { gap: 7px; }
      .key-box { flex-basis: 25%; min-width: 0; padding: 12px 4px; }
    }
  </style>
</head>
<body>

  <h1>ELKA SYNTHEX - HARPA LASER</h1>
  <p>Preset Nr. 46 (Pitch Glide Modulated Synced OSC) | Tone.js Engine</p>
  <p>Toque ou pressione uma tecla para tocar (o primeiro gesto ativa o áudio)</p>

  <div class="control-group" style="width:100%;max-width:800px;margin:0 0 14px">
    <label for="ctrl-volume" style="color:#00ffcc;display:flex;justify-content:space-between">Volume geral (↑ / ↓): <span id="val-volume">100%</span></label>
    <input type="range" id="ctrl-volume" min="0" max="200" step="5" value="100" style="width:100%;accent-color:#00ffcc;cursor:pointer" aria-label="Volume geral">
  </div>

  <details id="controls-details" style="display:none;width:100%;max-width:980px;margin-bottom:20px"><summary style="cursor:pointer;margin-bottom:10px">Ajustes do sintetizador</summary><div class="controls-panel" id="controls">
    <div class="control-group">
      <label>Glide / Portamento (ms): <span id="val-glide">35</span></label>
      <input type="range" id="ctrl-glide" min="5" max="250" step="5" value="35">
    </div>

    <div class="control-group">
      <label>Filtro Cutoff (Hz): <span id="val-cutoff">950</span></label>
      <input type="range" id="ctrl-cutoff" min="200" max="8000" step="50" value="950">
    </div>

    <div class="control-group">
      <label>Ressonância (Q): <span id="val-res">3.6</span></label>
      <input type="range" id="ctrl-res" min="0" max="10" step="0.1" value="3.6">
    </div>

    <div class="control-group">
      <label>Chorus Mix: <span id="val-chorus">5%</span></label>
      <input type="range" id="ctrl-chorus" min="0" max="1" step="0.05" value="0.05">
    </div>

    <div class="control-group">
      <label>Sweep OSC2 (semitons): <span id="val-sweep">1</span></label>
      <input type="range" id="ctrl-sweep" min="0" max="12" step="0.5" value="1">
    </div>

    <div class="control-group">
      <label>Sweep Tempo (ms): <span id="val-sweeptime">40</span></label>
      <input type="range" id="ctrl-sweeptime" min="20" max="400" step="5" value="40">
    </div>

    <div class="control-group">
      <label>Mix OSC2: <span id="val-osc2">26%</span></label>
      <input type="range" id="ctrl-osc2" min="0" max="1" step="0.01" value="0.26">
    </div>

    <div class="control-group">
      <label>Attack (ms): <span id="val-attack">10</span></label>
      <input type="range" id="ctrl-attack" min="1" max="2000" step="1" value="10">
    </div>

    <div class="control-group">
      <label>Decay (ms): <span id="val-decay">400</span></label>
      <input type="range" id="ctrl-decay" min="1" max="2000" step="1" value="400">
    </div>

    <div class="control-group">
      <label>Sustain: <span id="val-sustain">55%</span></label>
      <input type="range" id="ctrl-sustain" min="0" max="1" step="0.01" value="0.55">
    </div>

    <div class="control-group">
      <label>Release (ms): <span id="val-release">500</span></label>
      <input type="range" id="ctrl-release" min="1" max="4000" step="10" value="500">
    </div>
  </div>

  </details>

  <div id="audio-status" role="status" aria-live="polite" style="margin:10px 0;color:#00ffcc;text-align:center">Áudio ainda não iniciado</div>
  <button id="start-audio" type="button" style="padding:12px 20px;margin:6px 0 16px;background:#00ffcc;color:#0d0f12;border:0;border-radius:5px;font-weight:bold;cursor:pointer">Ativar áudio</button>
  <div class="keys-container" id="keyboard"></div>

  <script>
    window.addEventListener('error', function (event) {
      const el = document.getElementById('audio-status');
      if (el) { el.textContent = 'Erro de JavaScript: ' + (event.message || 'falha ao carregar script'); el.style.color = '#ff9292'; }
    });
  </script>
  <script src="app.js?v=20261029-defaults-adsr" onerror="document.getElementById('audio-status').textContent='Erro: não foi possível carregar app.js'"></script>
</body>
</html>
