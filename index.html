  <h1>HARPA LASER</h1>
  <p id="version-line" style="color:#4a6b63;font-size:0.8rem;margin:0 0 14px">versão…</p>
  <p>Toque ou pressione uma tecla para tocar (o primeiro gesto ativa o áudio)</p>

  <div class="control-group" style="width:100%;max-width:800px;margin:0 0 14px">
    <label for="ctrl-volume" style="color:#00ffcc;display:flex;justify-content:space-between">Volume geral (↑ / ↓): <span id="val-volume">170%</span></label>

  </div>

  <div class="control-group preset-picker" style="width:100%;max-width:800px;margin:0 0 10px">
    <label for="ctrl-preset" style="color:#00ffcc">Preset (vibe)</label>
    <select id="ctrl-preset" aria-label="Preset de sintetizador"></select>
  </div>

  <div class="vibe-save" style="width:100%;max-width:800px;margin:0 0 16px">
    <input type="text" id="vibe-name" placeholder="Nome da sua vibe" aria-label="Nome da vibe" maxlength="40">
    <button type="button" id="save-vibe">Salvar vibe</button>
    <button type="button" id="delete-vibe" style="display:none">Apagar</button>
  </div>

  <div class="vibe-io" style="width:100%;max-width:800px;margin:0 0 16px">
    <button type="button" id="export-vibe">Exportar arquivo</button>
    <button type="button" id="import-vibe">Importar arquivo</button>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none">
    <span id="vibe-toast" role="status" aria-live="polite"></span>
  </div>

  <details id="controls-details" style="width:100%;max-width:980px;margin-bottom:20px"><summary style="cursor:pointer;margin-bottom:10px">Ajustes do sintetizador</summary><div class="controls-panel" id="controls">
    <div class="control-group">
      <label for="ctrl-scale">Escala</label>
      <select id="ctrl-scale" aria-label="Escala"></select>
    </div>

    <div class="control-group">
      <label for="ctrl-root">Nota da 1ª tecla</label>
      <select id="ctrl-root" aria-label="Nota da primeira tecla"></select>
    </div>

    <div class="control-group">
      <label for="ctrl-wave1">Onda OSC1</label>
      <select id="ctrl-wave1" aria-label="Forma de onda do oscilador 1">
        <option value="pulse">Pulse</option>
        <option value="sawtooth">Dente de serra</option>
        <option value="square">Quadrada</option>
        <option value="triangle">Triângulo</option>
        <option value="sine">Senoide</option>
      </select>
    </div>

    <div class="control-group">
      <label for="ctrl-wave2">Onda OSC2</label>
      <select id="ctrl-wave2" aria-label="Forma de onda do oscilador 2">
        <option value="pulse">Pulse</option>
        <option value="sawtooth">Dente de serra</option>
        <option value="square">Quadrada</option>
        <option value="triangle">Triângulo</option>
        <option value="sine">Senoide</option>
      </select>
    </div>

    <div class="control-group">
      <label>Glide / Portamento (ms): <span id="val-glide">35</span></label>
      <input type="range" id="ctrl-glide" min="5" max="250" step="5" value="35">
    </div>

    <div class="control-group">
      <label>Filtro (× nota): <span id="val-cutoff">4.0×</span></label>
      <input type="range" id="ctrl-cutoff" min="1.5" max="8" step="0.1" value="4">
    </div>

    <div class="control-group">
      <label>Ressonância (Q): <span id="val-res">3.6</span></label>
      <input type="range" id="ctrl-res" min="0" max="10" step="0.1" value="3.6">
    </div>

    <div class="control-group">
      <label>Chorus Mix: <span id="val-chorus">5%</span></label>
      <input type="range" id="ctrl-chorus" min="0" max="1" step="0.01" value="0.05">
    </div>

    <div class="control-group">
      <label>Intervalo OSC2 (semitons): <span id="val-interval">31</span></label>
      <input type="range" id="ctrl-interval" min="0" max="36" step="1" value="31">
    </div>

    <div class="control-group">
      <label>Sweep OSC2 (semitons): <span id="val-sweep">1</span></label>
      <input type="range" id="ctrl-sweep" min="0" max="36" step="0.5" value="1">
    </div>

    <div class="control-group">
      <label>Sweep OSC2 Tempo (ms): <span id="val-sweeptime">40</span></label>
      <input type="range" id="ctrl-sweeptime" min="20" max="400" step="5" value="40">
    </div>

    <div class="control-group">
      <label>Sweep OSC1 (semitons): <span id="val-sweep1">0</span></label>
      <input type="range" id="ctrl-sweep1" min="0" max="36" step="0.5" value="0">
    </div>

    <div class="control-group">
      <label>Sweep OSC1 Tempo (ms): <span id="val-sweeptime1">120</span></label>
      <input type="range" id="ctrl-sweeptime1" min="20" max="400" step="5" value="120">
    </div>

    <div class="control-group">
      <label>Mix OSC2: <span id="val-osc2">26%</span></label>
      <input type="range" id="ctrl-osc2" min="0" max="1" step="0.01" value="0.26">
    </div>

    <div class="control-group">
      <label>Attack (ms): <span id="val-attack">10</span></label>
      <input type="range" id="ctrl-attack" min="1" max="2000" step="1" value="10">
    </div>

    <div class="control-group">
      <label>Decay (ms): <span id="val-decay">400</span></label>
      <input type="range" id="ctrl-decay" min="1" max="2000" step="1" value="400">
    </div>

    <div class="control-group">
      <label>Sustain: <span id="val-sustain">55%</span></label>
      <input type="range" id="ctrl-sustain" min="0" max="1" step="0.01" value="0.55">
    </div>

    <div class="control-group">
      <label>Release (ms): <span id="val-release">500</span></label>
      <input type="range" id="ctrl-release" min="0" max="4000" step="10" value="500">
    </div>
  </div>

  </details>

  <!-- Faixa de altura FIXA reservada: o botão sumir ou o texto mudar não
       empurra o teclado para cima/baixo. -->
  <div class="audio-bar">
    <button id="start-audio" type="button">Ativar áudio</button>
    <div id="audio-status" role="status" aria-live="polite">Áudio ainda não iniciado</div>
  </div>
  <div class="keys-container" id="keyboard"></div>

  <footer class="credits">
    <span>Harpa Laser por <strong>Mauricio Jabur — MauMaker</strong></span>
    <span class="sep">·</span>
    <span>Built with <strong>Kiro</strong></span>
  </footer>
